    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003566" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('trendz-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Premium upholstery and custom furniture studio. Sofa sets, upholstery, curtains, seat covers and custom furniture crafted to fit your space."
    />

    <meta property="og:description" content="Premium upholstery and custom furniture studio crafted to fit your space." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
